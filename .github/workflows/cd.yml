name: CD - build, publish and release versions of DbVault
# when we push git tag with version (v0.1.0) workflow starts, otherwise not standard push
# this is used to release version of project
on:
  push:
    tags: ['v*']
  workflow_dispatch:

# 1. allowed to create GitHub releases, 2. publish docker image to GHCR
permissions:
  contents: write
  packages: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      # download repo into VM
      - name: Checkout repository
        uses: actions/checkout@v6

      # cache maven dependencies between workflow runs to reduce build time for updates
      - name: Set up Java 25 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      # run full test during publish
      - name: Build and test
        run: mvn -B verify

      # build docker image (if built, this deletes and replace (updates) images))
      - name: Build image for smoke test
        uses: docker/build-push-action@v7
        with:
          context: .            # uses root as docker build nontext
          load: true            # load built image into runner's local Docker image store.
          tags: dbvault:smoke   # give a name to proccess

      # quick test when app start and perform for any security, vulnerability during in basic startup
      - name: Smoke test the image
        run: docker run --rm dbvault:smoke --help       # remove container after if it works perfectly

      # create GitHub release, triggered by v* tag
      - name: GitHub release with the jar
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}     #auto generated by GitHub
        # ref-name = tag name, then attach compiled jar and generate release notes
        run: gh release create "$GITHUB_REF_NAME" target/dbvault-*.jar --generate-notes

      - name: login and auth to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      #generate docker image metadata based on GitHub repo (name/dbvault becomes ghcr.io/name/dbvault
      - name: Generate image tags and labels
        id: meta
        uses: docker/metadata-action@v6
        with:
         images: ghcr.io/${{ github.repository }}
         tags: |
           type=semver,pattern={{version}}
           type=raw,value=latest
           type=sha

      # build image and push to GHCR
      - name: Publish docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}