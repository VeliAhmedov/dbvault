services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: testdb
      POSTGRES_USER: dbvault
      POSTGRES_PASSWORD: dbvault
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

